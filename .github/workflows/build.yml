
name: Build Aviator Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Find and extract project ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
                - name: Apply new Kotlin source files
         run: |
          if [ -d patch ]; then
            cp -a patch/. "$PROJECT_DIR"/
          fi
      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("project").glob("**/app/build.gradle.kts"))
          assert files, "App Gradle file not found"

          for f in files:
              s = f.read_text()
              if "jvmTarget" not in s:
                  s = s.replace(
                      "\n}\ndependencies {",
                      """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {""", 1
                  )
                  f.write_text(s)
          PY
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Floating-Analyzer-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          
